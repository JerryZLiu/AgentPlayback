name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      # npm can omit Rollup's platform binary from a lockfile generated on macOS.
      - run: npm install --no-save --workspace=agentplayback-ui @rollup/rollup-linux-x64-gnu@4.62.2
      - run: npm run build
      - name: Verify release tag matches package version
        run: |
          node -e "const p = require('./package.json'); const expected = 'v' + p.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Release tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected); process.exit(1) }"
      - run: npm pack --dry-run
      - run: npm publish --access public
