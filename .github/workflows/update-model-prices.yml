name: Update model prices

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-model-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-model-prices.mjs
      - name: Publish changed prices
        run: |
          if git diff --quiet -- pricing/openai-anthropic.json; then
            echo "Pricing is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing/openai-anthropic.json
          git commit -m "chore(pricing): refresh model rates"
          git push
